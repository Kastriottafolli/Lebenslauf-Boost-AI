name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Build public pages and application shell
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://kastriottafolli.github.io/Lebenslauf-Boost-AI' }}
          # Leave empty for a public preview. Only configure a reachable HTTPS backend.
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
          # Set / for a Pages custom domain; keep the project path for github.io hosting.
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || '/Lebenslauf-Boost-AI/' }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
